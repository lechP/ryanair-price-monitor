[project]
name = "ryanair-price-monitor"
version = "0.1.0"
description = "Ryanair return-trip price monitor with phone notifications"
readme = "README.md"
authors = [
    { name = "lech.piechota", email = "lech.piechota@ocado.com" }
]
requires-python = ">=3.12"
dependencies = [
    "ryanair-py>=3.0.0",
]

[build-system]
requires = ["uv_build>=0.9.2,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
